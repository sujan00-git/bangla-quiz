<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bangla Color Quiz</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 24px 16px;
    }

    .card {
      max-width: 760px;
      margin: 0 auto;
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(0,0,0,.35);
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: linear-gradient(135deg, #1a237e, #3949ab);
      color: #fff;
      padding: 26px 30px 20px;
      text-align: center;
    }
    header h1 { font-size: 1.75rem; letter-spacing: .5px; }
    header p  { margin-top: 6px; font-size: .9rem; opacity: .85; }

    /* ── Table ── */
    .table-wrap { padding: 16px 20px 8px; overflow-x: auto; }

    table { width: 100%; border-collapse: collapse; }

    thead tr { background: #283593; color: #fff; }
    thead th { padding: 10px 14px; text-align: left; font-size: .85rem;
               font-weight: 600; white-space: nowrap; }

    tbody tr { transition: background .25s; }
    tbody tr:nth-child(odd)  { background: #fff; }
    tbody tr:nth-child(even) { background: #f3f4fb; }

    td { padding: 10px 14px; vertical-align: middle; }
    td.sl      { text-align: center; font-weight: 700; color: #555;
                 font-size: .95rem; width: 48px; }
    td.english { font-size: 1rem; font-weight: 500; }
    td.bangla  { font-size: 1.1rem; font-weight: 700; color: #1a237e;
                 letter-spacing: .5px; }
    td.answer  { width: 90px; }
    td.answer input {
      width: 68px; padding: 6px 8px; border: 2px solid #bbb;
      border-radius: 8px; font-size: 1rem; text-align: center;
      transition: border-color .2s, background .25s;
      -moz-appearance: textfield;
    }
    td.answer input::-webkit-outer-spin-button,
    td.answer input::-webkit-inner-spin-button { -webkit-appearance: none; }
    td.answer input:focus { outline: none; border-color: #3949ab; }
    td.verdict { font-size: .9rem; font-weight: 700; white-space: nowrap; }

    /* ── Row state colours ── */
    tr.correct td          { background: #e8f5e9 !important; }
    tr.correct td.answer input { background: #c8e6c9; border-color: #43a047; }
    tr.correct td.verdict  { color: #2e7d32; }

    tr.wrong td            { background: #ffebee !important; }
    tr.wrong td.answer input { background: #ffcdd2; border-color: #e53935; }
    tr.wrong td.verdict    { color: #b71c1c; }

    tr.blank td            { background: #fff8e1 !important; }
    tr.blank td.answer input { background: #fff9c4; border-color: #ffc107; }
    tr.blank td.verdict    { color: #e65100; }

    /* ── Footer ── */
    .footer {
      background: #f0f2ff;
      border-top: 1px solid #e0e0e0;
      padding: 14px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    button {
      padding: 10px 22px;
      border: none;
      border-radius: 10px;
      font-size: .95rem;
      font-weight: 700;
      cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    button:hover  { filter: brightness(1.1); }
    button:active { transform: scale(.96); }

    #grade-btn { background: #2e7d32; color: #fff; }
    #new-btn   { background: #1565c0; color: #fff; }

    #score {
      margin-left: auto;
      font-size: 1.05rem;
      font-weight: 800;
    }
    #score.perfect { color: #2e7d32; }
    #score.great   { color: #1565c0; }
    #score.ok      { color: #e65100; }
    #score.low     { color: #b71c1c; }

    /* ── Celebration overlay ── */
    #confetti-msg {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,.45);
      z-index: 99;
      align-items: center;
      justify-content: center;
    }
    #confetti-msg.show { display: flex; }
    .celebrate-box {
      background: #fff;
      border-radius: 20px;
      padding: 40px 50px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,.4);
      animation: pop .3s ease;
    }
    @keyframes pop { from { transform: scale(.7); opacity: 0; }
                     to   { transform: scale(1);  opacity: 1; } }
    .celebrate-box .star { font-size: 3.5rem; }
    .celebrate-box h2 { font-size: 1.8rem; color: #2e7d32; margin: 12px 0 6px; }
    .celebrate-box p  { color: #555; margin-bottom: 20px; }
    .celebrate-box button { background: #2e7d32; color: #fff;
                             padding: 10px 28px; font-size: 1rem; }

    @media (max-width: 520px) {
      header h1   { font-size: 1.3rem; }
      td          { padding: 8px 8px; font-size: .85rem; }
      td.bangla   { font-size: .95rem; }
      td.answer input { width: 54px; }
    }
  </style>
</head>
<body>

<div class="card">
  <header>
    <h1>Bangla Color Quiz</h1>
    <p>Look at each Bangla word — type the <strong>Serial #</strong> of the English color it means</p>
  </header>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>English Word</th>
          <th>Bangla Word</th>
          <th>Your Answer</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="quiz-body"></tbody>
    </table>
  </div>

  <div class="footer">
    <button id="grade-btn" onclick="grade()">Grade My Answers</button>
    <button id="new-btn"   onclick="newQuiz()">New Quiz</button>
    <span id="score"></span>
  </div>
</div>

<!-- Perfect-score celebration -->
<div id="confetti-msg">
  <div class="celebrate-box">
    <div class="star">&#11088;</div>
    <h2>Perfect Score!</h2>
    <p>You got all 13 correct — amazing work!</p>
    <button onclick="closeModal(); newQuiz()">Play Again</button>
  </div>
</div>

<script>
  // ── Answer key — correct English → Bangla pairs ──────────────────────────
  // Teachers: update this list to change quiz words.
  const WORDS = [
    { serial:  1, english: "Black",  bangla: "KALO"    },
    { serial:  2, english: "Blue",   bangla: "NIL"     },
    { serial:  3, english: "Brown",  bangla: "BADAMI"  },
    { serial:  4, english: "Golden", bangla: "SHONALI" },
    { serial:  5, english: "Silver", bangla: "RUPALI"  },
    { serial:  6, english: "Green",  bangla: "SHOBUJ"  },
    { serial:  7, english: "Red",    bangla: "LAL"     },
    { serial:  8, english: "Yellow", bangla: "HOLUD"   },
    { serial:  9, english: "Pink",   bangla: "GOLAPI"  },
    { serial: 10, english: "White",  bangla: "SHADA"   },
    { serial: 11, english: "Violet", bangla: "BEGUNI"  },
    { serial: 12, english: "Color",  bangla: "RONG"    },
    { serial: 13, english: "Grey",   bangla: "DHUSHOR" },
  ];

  let answerKey = []; // answerKey[i] = correct serial for quiz row i (hidden)

  // Fisher-Yates shuffle
  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  // Shuffle so no Bangla word lands on its own row (derangement)
  function derange(arr) {
    let result, tries = 0;
    do {
      result = shuffle(arr);
      tries++;
    } while (tries < 50 && result.some((w, i) => w.serial === arr[i].serial));
    return result;
  }

  function newQuiz() {
    closeModal();
    const shuffled = derange(WORDS);
    answerKey = shuffled.map(w => w.serial); // hidden from student

    const tbody = document.getElementById('quiz-body');
    tbody.innerHTML = '';
    document.getElementById('score').textContent = '';
    document.getElementById('score').className = '';

    WORDS.forEach((word, i) => {
      const tr = document.createElement('tr');
      tr.id = `row-${i}`;
      tr.innerHTML = `
        <td class="sl">${word.serial}</td>
        <td class="english">${word.english}</td>
        <td class="bangla">${shuffled[i].bangla}</td>
        <td class="answer">
          <input type="number" id="ans-${i}" min="1" max="${WORDS.length}"
            placeholder="#"
            onkeydown="if(event.key==='Enter'||event.key==='Tab'){event.preventDefault();focusNext(${i});}"
          >
        </td>
        <td class="verdict" id="v-${i}"></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById('ans-0').focus();
  }

  function focusNext(i) {
    const next = document.getElementById(`ans-${i + 1}`);
    if (next) next.focus(); else grade();
  }

  function grade() {
    let correct = 0;
    const total = WORDS.length;

    WORDS.forEach((_, i) => {
      const input   = document.getElementById(`ans-${i}`);
      const verdict = document.getElementById(`v-${i}`);
      const row     = document.getElementById(`row-${i}`);
      const val     = input.value.trim();
      const student = parseInt(val);
      const right   = answerKey[i];

      row.className = '';

      if (!val) {
        row.classList.add('blank');
        verdict.textContent = `→ ${right}`;
      } else if (student === right) {
        correct++;
        row.classList.add('correct');
        verdict.textContent = '✓';
      } else {
        row.classList.add('wrong');
        verdict.textContent = `✗ → ${right}`;
      }
    });

    const pct = Math.round(correct / total * 100);
    const scoreEl = document.getElementById('score');

    if (pct === 100) {
      scoreEl.textContent = `Perfect! ${correct}/${total} ★`;
      scoreEl.className = 'perfect';
      setTimeout(() => document.getElementById('confetti-msg').classList.add('show'), 400);
    } else if (pct >= 80) {
      scoreEl.textContent = `Great!  ${correct}/${total} (${pct}%)`;
      scoreEl.className = 'great';
    } else if (pct >= 60) {
      scoreEl.textContent = `Good!  ${correct}/${total} (${pct}%)`;
      scoreEl.className = 'ok';
    } else {
      scoreEl.textContent = `${correct}/${total} (${pct}%) — Keep trying!`;
      scoreEl.className = 'low';
    }
  }

  function closeModal() {
    document.getElementById('confetti-msg').classList.remove('show');
  }

  // Start on load
  newQuiz();
</script>
</body>
</html>
